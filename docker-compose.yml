services:
  postgres:
    image: postgres:18-alpine
    container_name: deepblue-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deepblue
    ports:
      - "5432:5432"
    volumes:
      # postgres 18+ almacena los datos en un subdirectorio con la version mayor
      - deepblue-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deepblue"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  deepblue-data:
